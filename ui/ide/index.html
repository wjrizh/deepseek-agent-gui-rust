<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>力工 IDE</title>
  <link rel="stylesheet" href="ide.css" />
  <link rel="stylesheet" href="../vendor/monaco/vs/editor/editor.main.css" />
</head>
<body>
  <!-- 顶部标题栏（可拖动） -->
  <header id="titlebar" class="titlebar">
    <div class="traffic" id="win-controls">
      <button class="tl-btn close" data-win="close" title="关闭"></button>
      <button class="tl-btn min" data-win="min" title="最小化"></button>
      <button class="tl-btn max" data-win="max" title="最大化"></button>
    </div>
    <div class="title-center">
      <span class="title-dot"></span>
      <span id="project-name" class="project-name">IDE</span>
      <span id="dirty-flag" class="dirty-flag hidden">●</span>
    </div>
    <div class="title-right">
      <button id="undo-btn" class="icon-act" title="撤回 (Ctrl+Z)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M9 7L4 12l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 12h9a6 6 0 010 12h-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="redo-btn" class="icon-act" title="前进 (Ctrl+Y / Ctrl+Shift+Z)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M15 7l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12H11a6 6 0 000 12h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="save-btn" class="icon-act" title="保存 (Ctrl+S)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M5 4h11l3 3v13H5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 4v5h7V4M8 20v-6h8v6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <!-- 左侧：活动栏 + 面板 -->
    <aside id="sidebar" class="sidebar">
      <!-- 活动栏（VSCode 风格） -->
      <div id="activitybar" class="activitybar">
        <button class="act-item active" data-view="explorer" title="资源管理器">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"><path d="M3 6.5A1.5 1.5 0 014.5 5h4l2 2h7A1.5 1.5 0 0119 8.5v8A1.5 1.5 0 0117.5 18h-13A1.5 1.5 0 013 16.5v-10z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </button>
        <button class="act-item" data-view="scm" title="源代码管理">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"><circle cx="7" cy="6" r="2.2" stroke="currentColor" stroke-width="1.5"/><circle cx="7" cy="18" r="2.2" stroke="currentColor" stroke-width="1.5"/><circle cx="17" cy="9" r="2.2" stroke="currentColor" stroke-width="1.5"/><path d="M7 8.2v7.6M17 11.2c0 3-2.5 4-6 4.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span id="act-scm-badge" class="act-badge hidden"></span>
        </button>
        <button class="act-item" data-view="ssh" title="SSH 文件浏览">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none"><rect x="3" y="4" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M7 20h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M8 9l2.5 2.5L8 14M12.5 14H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <!-- 资源管理器面板 -->
      <div class="sidebar-pane explorer-pane" id="explorer-pane">
        <div class="sidebar-head">
          <span class="sidebar-title">资源管理器</span>
          <div class="sidebar-actions">
            <button id="up-btn" class="icon-btn" title="上一层">↑</button>
            <button id="refresh-btn" class="icon-btn" title="刷新">⟳</button>
          </div>
        </div>
        <div id="sidebar-path" class="sidebar-path" title="当前文件夹">/</div>
        <div class="search-wrap">
          <input id="file-search" class="file-search" type="text" placeholder="搜索文件…" />
        </div>
        <div id="file-tree" class="file-tree"></div>
      </div>

      <!-- 源代码管理面板 -->
      <div class="sidebar-pane scm-pane hidden" id="scm-pane">
        <div class="sidebar-head scm-head">
          <span class="sidebar-title">源代码管理</span>
          <div class="sidebar-actions">
            <button id="scm-branch" class="scm-branch hidden" title="分支"></button>
            <span id="scm-sync" class="scm-sync hidden"></span>
            <button id="scm-refresh-btn" class="icon-btn" title="刷新">⟳</button>
          </div>
        </div>
        <div class="scm-tabs">
          <button id="scm-tab-changes" class="scm-tab active">更改</button>
          <button id="scm-tab-history" class="scm-tab">历史</button>
        </div>
        <div id="scm-toolbar" class="scm-toolbar hidden">
          <button id="scm-stage-all" class="scm-tool" title="全部暂存">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button id="scm-unstage-all" class="scm-tool" title="全部取消暂存">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><path d="M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div id="scm-body" class="scm-body">
          <div id="scm-empty" class="scm-empty">未检测到 Git 仓库<button id="scm-init-btn" class="scm-btn primary scm-init-btn">初始化 Git 仓库</button><button id="scm-clone-btn" class="scm-btn scm-init-btn">克隆仓库</button></div>
          <div id="scm-groups" class="scm-groups"></div>
          <div id="scm-history" class="scm-history hidden"></div>
        </div>
        <div id="scm-commit-wrap" class="scm-commit-wrap hidden">
          <textarea id="scm-message" class="scm-message" rows="2" placeholder="提交信息（Ctrl+Enter 提交）"></textarea>
          <div class="scm-commit-actions">
            <button id="scm-commit-btn" class="scm-btn primary" title="提交已暂存更改">提交</button>
            <button id="scm-pull-btn" class="scm-btn" title="从远程拉取">拉取</button>
            <button id="scm-push-btn" class="scm-btn" title="推送到远程">推送</button>
          </div>
        </div>
      </div>

      <!-- SSH 文件浏览器（独立于项目，支持多主机） -->
      <div class="sidebar-pane ssh-pane hidden" id="ssh-pane">
        <div class="sidebar-head">
          <span class="sidebar-title">SSH</span>
          <div class="sidebar-actions">
            <button id="ssh-up" class="icon-btn" title="上一层">↑</button>
            <button id="ssh-refresh" class="icon-btn" title="刷新">⟳</button>
          </div>
        </div>
        <div class="ssh-host-row">
          <select id="ssh-host" class="ssh-host-select">
            <option value="">— 选择主机 —</option>
          </select>
        </div>
        <div id="ssh-tabs" class="ssh-tabs"></div>
        <div class="ssh-path-row">
          <input id="ssh-path" class="ssh-path-input" placeholder="远程绝对路径，回车跳转" />
        </div>
        <div class="ssh-actions">
          <button id="ssh-terminal" class="ssh-act" title="在该主机打开终端">⌨ 终端</button>
          <button id="ssh-upload" class="ssh-act" title="上传到当前目录">⬆ 上传</button>
          <button id="ssh-newfile" class="ssh-act" title="新建文件">＋文件</button>
          <button id="ssh-newdir" class="ssh-act" title="新建目录">＋目录</button>
        </div>
        <div id="ssh-list" class="ssh-list"></div>
      </div>
    </aside>

    <!-- 拖拽分隔条 -->
    <div id="splitter" class="splitter"></div>

    <!-- 右侧：编辑器 -->
    <main class="editor-area">
      <div id="tabs" class="tabs"></div>
      <div class="breadcrumb" id="breadcrumb"></div>
      <div id="editor-host" class="editor-host">
        <div id="welcome" class="welcome">
          <div class="welcome-logo">⌘</div>
          <div class="welcome-title">力工 IDE</div>
          <div class="welcome-sub">从左侧选择一个文件开始编辑</div>
        </div>
        <div id="monaco-host" class="monaco-host hidden"></div>
        <div id="preview-host" class="preview-host hidden"></div>
        <div id="agent-diff-banner" class="agent-diff-banner hidden">
          <span id="agent-diff-title">Agent 改动</span>
          <button id="btn-diff-mode" type="button">并排/内联</button>
          <button id="btn-close-diff" type="button">返回编辑</button>
        </div>
        <div id="git-diff-banner" class="agent-diff-banner git-diff-banner hidden">
          <span id="git-diff-title">更改</span>
          <button id="btn-git-diff-mode" type="button">并排/内联</button>
          <button id="btn-close-git-diff" type="button">跳转到文件</button>
        </div>
        <div id="diff-host" class="diff-host hidden"></div>
      </div>
      <div id="bottom-panel" class="bottom-panel hidden">
        <div class="bottom-tabs">
          <button id="bottom-tab-term" class="bottom-tab active">终端</button>
          <button id="bottom-tab-agent" class="bottom-tab">对话</button>
          <button id="bottom-tab-ports" class="bottom-tab">端口</button>
          <div class="bottom-actions">
            <button id="bottom-close" class="term-btn" title="隐藏面板">✕</button>
          </div>
        </div>

        <div id="terminal-panel" class="terminal-panel">
          <div class="term-head">
            <div id="term-tabs" class="term-tabs"></div>
            <div class="term-actions">
              <button id="term-remote" class="term-btn" title="新建远程终端 (SSH)" style="display:none">⇄</button>
              <button id="term-new" class="term-btn" title="新建终端">＋</button>
            </div>
          </div>
          <div id="term-hosts" class="term-hosts"></div>
        </div>

        <div id="agent-panel" class="agent-panel hidden">
          <div id="agent-body" class="agent-body"></div>
          <div class="agent-input-row">
            <textarea id="agent-input" class="agent-input" rows="1" placeholder="输入消息（Enter 发送，Shift+Enter 换行；可拖入文件）"></textarea>
            <button id="agent-send" class="agent-btn primary" title="发送">发送</button>
            <button id="agent-stop" class="agent-btn danger hidden" title="停止">停止</button>
            <span id="agent-status" class="agent-status"></span>
          </div>
        </div>

        <div id="ports-panel" class="ports-panel hidden">
          <div class="ports-form">
            <input id="fwd-local" class="ports-input" placeholder="本地端口" />
            <input id="fwd-remote-host" class="ports-input" placeholder="远端主机" />
            <input id="fwd-remote-port" class="ports-input" placeholder="远端端口" />
            <button id="fwd-add" class="term-btn">转发</button>
          </div>
          <div id="ports-list" class="ports-list"></div>
        </div>
      </div>
      <div id="statusbar" class="statusbar">
        <span id="status-path">就绪</span>
        <span id="status-meta"></span>
      </div>
    </main>
  </div>

  <!-- 自定义模态：新建/重命名输入 & 删除确认 -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title" id="modal-title">标题</div>
      <div class="modal-body">
        <input id="modal-input" class="modal-input" type="text" />
        <div id="modal-text" class="modal-text hidden"></div>
      </div>
      <div class="modal-actions">
        <button id="modal-cancel" class="modal-btn">取消</button>
        <button id="modal-ok" class="modal-btn primary">确定</button>
      </div>
    </div>
  </div>

  <link rel="stylesheet" href="../vendor/xterm/xterm.css" />
  <script src="../vendor/monaco/vs/loader.js"></script>
  <script type="module" src="ide.js"></script>
</body>
</html>
