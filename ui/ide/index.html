<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>力工 IDE</title>
  <link rel="stylesheet" href="ide.css" />
  <link rel="stylesheet" href="../vendor/monaco/vs/editor/editor.main.css" />
</head>
<body>
  <!-- 顶部标题栏（可拖动） -->
  <header id="titlebar" class="titlebar">
    <div class="traffic" id="win-controls">
      <button class="tl-btn close" data-win="close" title="关闭"></button>
      <button class="tl-btn min" data-win="min" title="最小化"></button>
      <button class="tl-btn max" data-win="max" title="最大化"></button>
    </div>
    <div class="title-center">
      <span class="title-dot"></span>
      <span id="project-name" class="project-name">IDE</span>
      <span id="dirty-flag" class="dirty-flag hidden">●</span>
    </div>
    <div class="title-right">
      <button id="undo-btn" class="icon-act" title="撤回 (Ctrl+Z)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M9 7L4 12l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 12h9a6 6 0 010 12h-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="redo-btn" class="icon-act" title="前进 (Ctrl+Y / Ctrl+Shift+Z)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M15 7l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12H11a6 6 0 000 12h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="save-btn" class="icon-act" title="保存 (Ctrl+S)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M5 4h11l3 3v13H5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 4v5h7V4M8 20v-6h8v6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <!-- 左侧：文件树 + 源代码管理 -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-pane explorer-pane">
        <div class="sidebar-head">
          <span class="sidebar-title">资源管理器</span>
          <div class="sidebar-actions">
            <button id="up-btn" class="icon-btn" title="上一层">↑</button>
            <button id="refresh-btn" class="icon-btn" title="刷新">⟳</button>
          </div>
        </div>
        <div id="sidebar-path" class="sidebar-path" title="当前文件夹">/</div>
        <div class="search-wrap">
          <input id="file-search" class="file-search" type="text" placeholder="搜索文件…" />
        </div>
        <div id="file-tree" class="file-tree"></div>
      </div>

      <div class="sidebar-pane scm-pane" id="scm-pane">
        <div class="sidebar-head scm-head">
          <span class="sidebar-title">源代码管理</span>
          <div class="sidebar-actions">
            <span id="scm-branch" class="scm-branch hidden"></span>
            <span id="scm-sync" class="scm-sync hidden"></span>
            <button id="scm-refresh-btn" class="icon-btn" title="刷新">⟳</button>
          </div>
        </div>
        <div id="scm-toolbar" class="scm-toolbar hidden">
          <button id="scm-stage-all" class="scm-tool" title="全部暂存">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button id="scm-unstage-all" class="scm-tool" title="全部取消暂存">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><path d="M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div id="scm-body" class="scm-body">
          <div id="scm-empty" class="scm-empty">未检测到 Git 仓库</div>
          <div id="scm-groups" class="scm-groups"></div>
          <div id="scm-commit-wrap" class="scm-commit-wrap hidden">
            <textarea id="scm-message" class="scm-message" rows="2" placeholder="提交信息（Ctrl+Enter 提交）"></textarea>
            <div class="scm-commit-actions">
              <button id="scm-commit-btn" class="scm-btn primary" title="提交已暂存更改">提交</button>
              <button id="scm-pull-btn" class="scm-btn" title="从远程拉取">拉取</button>
              <button id="scm-push-btn" class="scm-btn" title="推送到远程">推送</button>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- 拖拽分隔条 -->
    <div id="splitter" class="splitter"></div>

    <!-- 右侧：编辑器 -->
    <main class="editor-area">
      <div id="tabs" class="tabs"></div>
      <div class="breadcrumb" id="breadcrumb"></div>
      <div id="editor-host" class="editor-host">
        <div id="welcome" class="welcome">
          <div class="welcome-logo">⌘</div>
          <div class="welcome-title">力工 IDE</div>
          <div class="welcome-sub">从左侧选择一个文件开始编辑</div>
        </div>
        <div id="monaco-host" class="monaco-host hidden"></div>
        <div id="preview-host" class="preview-host hidden"></div>
        <div id="agent-diff-banner" class="agent-diff-banner hidden">
          <span id="agent-diff-title">Agent 改动</span>
          <button id="btn-diff-mode" type="button">并排/内联</button>
          <button id="btn-close-diff" type="button">返回编辑</button>
        </div>
        <div id="git-diff-banner" class="agent-diff-banner git-diff-banner hidden">
          <span id="git-diff-title">更改</span>
          <button id="btn-git-diff-mode" type="button">并排/内联</button>
          <button id="btn-close-git-diff" type="button">返回编辑</button>
        </div>
        <div id="diff-host" class="diff-host hidden"></div>
      </div>
      <div id="statusbar" class="statusbar">
        <span id="status-path">就绪</span>
        <span id="status-meta"></span>
      </div>
    </main>
  </div>

  <!-- 自定义模态：新建/重命名输入 & 删除确认 -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-title" id="modal-title">标题</div>
      <div class="modal-body">
        <input id="modal-input" class="modal-input" type="text" />
        <div id="modal-text" class="modal-text hidden"></div>
      </div>
      <div class="modal-actions">
        <button id="modal-cancel" class="modal-btn">取消</button>
        <button id="modal-ok" class="modal-btn primary">确定</button>
      </div>
    </div>
  </div>

  <script src="../vendor/monaco/vs/loader.js"></script>
  <script type="module" src="ide.js"></script>
</body>
</html>
