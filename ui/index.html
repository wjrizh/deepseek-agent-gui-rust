<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>力工Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-top">
        <div class="brand">力工Studio</div>
        <button id="new-project" class="nav-item">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
          <span>新项目</span>
        </button>
      </div>

      <div class="side-group">
        <div class="side-label">项目</div>
        <div id="project-list" class="project-list"></div>
      </div>

      <div class="side-spacer"></div>

      <div class="side-group">
        <button id="manage-account" class="nav-item">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zM12 8a3 3 0 110 6 3 3 0 010-6zM6 20a8 8 0 0112 0" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>
          <span>账号管理</span>
        </button>
        <button id="add-account" class="nav-item">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>
          <span>添加账号</span>
        </button>
      </div>
    </aside>

    <main id="main">
      <header id="titlebar">
        <div id="titlebar-drag" class="titlebar-drag"></div>
        <div class="titlebar-title">力工Studio</div>
        <div class="titlebar-actions">
          <button id="win-min" class="win-btn" title="最小化">
            <svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 12h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
          <button id="win-close" class="win-btn close" title="关闭">
            <svg viewBox="0 0 24 24" width="14" height="14"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>

      <div id="messages"></div>

      <div id="workdir-bar" class="workdir-bar">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/></svg>
        <input id="workdir-input" class="workdir-input" type="text" readonly placeholder="工作目录" />
        <label id="restrict-toggle" class="restrict-toggle" title="禁止访问工作目录之外">
          <input type="checkbox" id="restrict-check" />
          <span class="restrict-track"><span class="restrict-knob"></span></span>
          <span class="restrict-label">限制</span>
        </label>
        <label id="compact-label" class="compact-label" title="上下文压缩阈值（消息条数），达到后自动交接">
          <span class="compact-text">压缩阈值</span>
          <input id="compact-input" class="compact-input" type="number" min="1" step="1" placeholder="300" />
        </label>
        <button id="ide-btn" class="ide-btn" title="打开该项目的 IDE 窗口">IDE</button>
      </div>

      <div id="composer">
        <div class="composer-box">
          <div id="file-chips" class="file-chips hidden"></div>
          <textarea id="input" rows="1" placeholder="给 力工 发送消息…"></textarea>
          <div class="composer-bar">
            <button id="file-btn" class="mode-toggle" title="上传文件">
              <svg viewBox="0 0 24 24" width="15" height="15"><path d="M21 12.5l-8.5 8.5a5 5 0 01-7-7l8-8a3.5 3.5 0 015 5l-8 8a2 2 0 01-3-3l7.5-7.5" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="mode-toggle" class="mode-toggle" title="切换执行模式">
              <span class="mode-dot"></span>
              <span class="mode-label">Safe</span>
            </button>
            <button id="think-toggle" class="mode-toggle think" title="深度思考">
              <span class="mode-dot"></span>
              <span class="mode-label">Think</span>
            </button>
            <button id="search-toggle" class="mode-toggle search" title="联网搜索">
              <span class="mode-dot"></span>
              <span class="mode-label">Search</span>
            </button>
            <button id="qq-toggle" class="mode-toggle qq" title="QQ 接入">
              <span class="mode-dot"></span>
              <span class="mode-label">QQ</span>
            </button>
            <span class="hint">Enter 发送 · Shift+Enter 换行</span>
            <button id="send" class="send-btn" title="发送">
              <svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="stop" class="send-btn stop hidden" title="停止">
              <svg viewBox="0 0 24 24" width="14" height="14"><rect x="7" y="7" width="10" height="10" rx="2.5" fill="currentColor"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modal-title">添加账号</h3>
      <p id="modal-desc">填写账号名，将打开浏览器完成登录。</p>
      <input id="modal-name" type="text" placeholder="账号名，如 z" />
      <div class="modal-actions">
        <button id="modal-cancel" class="btn ghost">取消</button>
        <button id="modal-ok" class="btn primary">打开浏览器登录</button>
      </div>
    </div>
  </div>

  <div id="project-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="project-modal-title">新建项目</h3>
      <p id="project-modal-desc">给项目起个名字。</p>
      <input id="project-modal-name" type="text" placeholder="项目名，如 我的服务" />
      <div id="project-account" class="dropdown project-account-dropdown">
        <button type="button" id="project-account-toggle" class="project-account-select">
          <span id="project-account-label">请选择账号</span>
        </button>
        <div id="project-account-menu" class="dropdown-menu hidden"></div>
      </div>
      <div class="modal-actions">
        <button id="project-modal-cancel" class="btn ghost">取消</button>
        <button id="project-modal-ok" class="btn primary">确定</button>
      </div>
    </div>
  </div>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-box settings-box">
      <div class="settings-head">
        <h3 id="settings-title">项目</h3>
        <button id="settings-close" class="icon-btn" title="关闭">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="settings-actions">
        <button id="settings-new-conv" class="btn primary sm">新建对话</button>
        <button id="settings-add-history" class="btn ghost sm">添加历史对话</button>
        <button id="settings-rename" class="btn ghost sm">重命名项目</button>
        <button id="settings-clear-history" class="btn ghost sm danger">清除本地历史</button>
        <button id="settings-delete" class="btn ghost sm danger">删除项目</button>
      </div>

      <div class="settings-sub">对话（共 <span id="settings-conv-count">0</span> 个）</div>
      <div id="settings-conv-list" class="conv-list"></div>
    </div>
  </div>

  <div id="account-modal" class="modal hidden">
    <div class="modal-box">
      <h3>账号管理</h3>
      <div id="account-list" class="account-list"></div>
      <div class="modal-actions">
        <button id="account-close" class="btn ghost">关闭</button>
      </div>
    </div>
  </div>

  <div id="session-modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="session-title">历史对话</h3>
      <div id="session-list" class="session-list"></div>
      <div class="modal-actions">
        <button id="session-delete" class="btn ghost danger">删除所选</button>
        <button id="session-close" class="btn ghost">关闭</button>
      </div>
    </div>
  </div>

  <div id="approval" class="approval-mask hidden">
    <div class="approval-sheet">
      <div class="approval-head">
        <span class="approval-ico">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3l9 4v5c0 5-3.8 8.5-9 9.5C6.8 20.5 3 17 3 12V7l9-4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9v4M12 16.5v.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <div>
          <div class="approval-title">允许执行此命令？</div>
          <div class="approval-sub">该操作将在你的系统上运行</div>
        </div>
      </div>
      <pre id="approval-cmd" class="approval-cmd"></pre>
      <div class="approval-actions">
        <button id="approval-deny" class="btn ghost">拒绝</button>
        <button id="approval-allow" class="btn primary">允许</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
